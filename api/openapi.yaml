openapi: 3.1.0
info:
  title: Canarias Distance Matrix API
  version: 2.0.0
paths:
  /v1/health:
    get:
      responses:
        '200': {description: Healthy}
  /v1/distances/{origin}/{destination}:
    get:
      parameters:
        - name: origin
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]{8}$'}
        - name: destination
          in: path
          required: true
          schema: {type: string, pattern: '^[0-9]{8}$'}
      responses:
        '200': {description: Distance in meters}
        '404': {description: Unknown location}
        '422': {description: Unsupported or unavailable distance}
        '503': {description: Artifact unavailable}
