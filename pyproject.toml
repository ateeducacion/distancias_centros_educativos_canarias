[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "canarias-route-matrix"
version = "0.0.2"
description = "Static road route matrix for Canary Islands educational centers"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = ["httpx>=0.27,<1", "jsonschema>=4.23,<5", "zstandard>=0.23,<1"]

[project.optional-dependencies]
dev = ["hypothesis>=6.112", "mypy>=1.11", "pytest>=8.3", "pytest-cov>=5", "ruff>=0.6", "types-jsonschema>=4.23"]
docs = ["zensical>=0.0.8"]

[project.scripts]
canarias-route-matrix = "canarias_route_matrix.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/python/canarias_route_matrix"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["canarias_route_matrix"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src/python"]

[tool.coverage.run]
source = ["canarias_route_matrix"]
branch = true
