name: Data release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish or repair
        required: true
        type: string
permissions: {contents: write}
concurrency:
  group: "release-${{ inputs.tag || github.ref }}"
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: "${{ github.token }}"
      RELEASE_TAG: "${{ inputs.tag || github.ref_name }}"
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          ref: "${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}"
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7 # v7
      - name: Install data build dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Validate release tag
        run: |
          git fetch --force --tags origin
          git rev-parse "refs/tags/$RELEASE_TAG"
          git merge-base --is-ancestor "refs/tags/$RELEASE_TAG" HEAD
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists" >&2
            exit 1
          fi
      - name: Build release data from the tagged main state
        run: DATA_VERSION="$RELEASE_TAG" sh scripts/build-data-ci.sh
      - name: Verify release artifacts
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          uv run --project .. --with jsonschema python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import validate

          root = Path("..")
          manifest = json.loads(Path("manifest.json").read_text(encoding="utf-8"))
          schema = json.loads((root / "data/schemas/manifest.schema.json").read_text(encoding="utf-8"))
          validate(manifest, schema)
          if manifest["data_version"] != "${{ inputs.tag || github.ref_name }}":
              raise SystemExit("Manifest data version does not match the release tag")
          PY
      - name: Publish GitHub Release
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
