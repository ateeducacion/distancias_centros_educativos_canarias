name: Release
on:
  push:
    tags: ['v*', 'data-*']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: "release-${{ github.ref }}", cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # v7
      - uses: astral-sh/setup-uv@v7 # v7
      - name: Verify release data checksums
        run: sha256sum -c SHA256SUMS
        working-directory: docs/data/latest
      - name: Verify manifest schema
        run: uv run --with jsonschema python -c 'import json; from jsonschema import validate; validate(json.load(open("docs/data/latest/manifest.json")), json.load(open("data/schemas/manifest.schema.json")))'
      - name: Verify tag and data version match
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: "${{ github.ref_name }}"
        run: uv run python -c 'import json, os; value=json.load(open("docs/data/latest/manifest.json"))["data_version"]; tag=os.environ["RELEASE_TAG"]; assert value == tag, f"manifest {value!r} != tag {tag!r}"'
      - name: Stage release assets
        run: |
          mkdir release-assets
          cp docs/data/latest/canarias-education-routes.bin release-assets/
          cp docs/data/latest/centers.min.json release-assets/
          cp docs/data/latest/manifest.json release-assets/
          cp docs/data/latest/SHA256SUMS release-assets/
      - uses: actions/upload-artifact@v7 # v7
        with:
          name: "release-${{ github.ref_name }}"
          path: release-assets
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4 # v4
        with:
          name: "release-${{ github.ref_name }}"
          path: release-assets
      - name: Create GitHub Release
        env:
          GH_TOKEN: "${{ github.token }}"
          GH_REPO: "${{ github.repository }}"
        run: gh release create "${{ github.ref_name }}" release-assets/* --verify-tag --generate-notes --title "${{ github.ref_name }}"
