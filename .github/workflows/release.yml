name: Release validation
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: "release-${{ github.ref }}", cancel-in-progress: false}
jobs:
  verify-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # v7
      - uses: astral-sh/setup-uv@v7 # v7
      - name: Verify tag and package versions
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: "${{ github.ref_name }}"
        run: |
          uv run python -c 'import os,tomllib; expected=os.environ["RELEASE_TAG"].removeprefix("v"); actual=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert actual == expected, f"Python {actual} != {expected}"'
          node -e 'const expected=process.env.RELEASE_TAG.replace(/^v/,""); const actual=require("./packages/javascript/package.json").version; if(actual!==expected) throw new Error(`JavaScript ${actual} != ${expected}`)'
