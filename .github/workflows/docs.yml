name: Publish

on:
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: Rebuild data and publish a dated release if the result changed
        required: true
        default: true
        type: boolean
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      - name: Plan data rebuild
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          MANUAL_REBUILD: ${{ inputs.rebuild_data }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          rebuild=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            rebuild="${MANUAL_REBUILD:-true}"
          elif [ "$EVENT_NAME" = "schedule" ]; then
            latest_tag="$(
              gh release list \
                --exclude-drafts \
                --exclude-pre-releases \
                --limit 100 \
                --json tagName,publishedAt \
                --jq "$(cat scripts/latest-data-release.jq)"
            )"

            if [ -z "$latest_tag" ]; then
              rebuild=true
            else
              rm -rf previous-source .source-check
              mkdir -p previous-source
              gh release download "$latest_tag" \
                --pattern manifest.json \
                --dir previous-source

              uv run python -m canarias_route_matrix.cli \
                --cache-dir .source-check \
                download-centers

              current_sha="$(jq -r '.sha256' .source-check/centers.meta.json)"
              previous_sha="$(jq -r '.centers_source.sha256 // ""' previous-source/manifest.json)"

              if [ "$current_sha" != "$previous_sha" ]; then
                rebuild=true
              fi
            fi
          elif [ -z "${BEFORE_SHA:-}" ] ||
            [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ] ||
            ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            rebuild=true
          elif ! git diff --quiet "$BEFORE_SHA" "$GITHUB_SHA" -- \
            .github/workflows/docs.yml \
            config \
            data/schemas/manifest.schema.json \
            pyproject.toml \
            scripts/build-data-ci.sh \
            scripts/build-production.py \
            scripts/latest-data-release.jq \
            src/python \
            uv.lock; then
            rebuild=true
          fi

          echo "rebuild_data=$rebuild" >> "$GITHUB_OUTPUT"

      - name: Build current data
        id: build-data
        if: steps.plan.outputs.rebuild_data == 'true'
        run: |
          set -eu

          version="data-$(date -u +%Y%m%d-%H%M)"
          epoch="$(date -u +%s)"

          echo "version=$version" >> "$GITHUB_OUTPUT"

          DATA_VERSION="$version" \
          SOURCE_DATE_EPOCH="$epoch" \
          sh scripts/build-data-ci.sh

      - name: Compare with the latest data release
        id: compare
        if: steps.plan.outputs.rebuild_data == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu

          latest_tag="$(
            gh release list \
              --exclude-drafts \
              --exclude-pre-releases \
              --limit 100 \
              --json tagName,publishedAt \
              --jq "$(cat scripts/latest-data-release.jq)"
          )"
          changed=true

          if [ -n "$latest_tag" ]; then
            rm -rf previous-data
            mkdir -p previous-data

            if gh release download "$latest_tag" \
              --pattern manifest.json \
              --dir previous-data; then
              current_matrix="$(sha256sum dist/canarias-distances.dat | cut -d ' ' -f 1)"
              current_centers="$(sha256sum dist/centers.min.json | cut -d ' ' -f 1)"
              previous_matrix="$(jq -r '.artifacts["canarias-distances.dat"].sha256 // ""' previous-data/manifest.json)"
              previous_centers="$(jq -r '.artifacts["centers.min.json"].sha256 // ""' previous-data/manifest.json)"

              if [ "$current_matrix" = "$previous_matrix" ] &&
                [ "$current_centers" = "$previous_centers" ]; then
                changed=false
              fi
            fi
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Publish dated data release
        if: steps.plan.outputs.rebuild_data == 'true' && steps.compare.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_VERSION: ${{ steps.build-data.outputs.version }}
        run: |
          set -eu

          (
            cd dist
            sha256sum -c SHA256SUMS
          )

          centers="$(jq -r '.counts.centers' dist/manifest.json)"
          locations="$(jq -r '.counts.locations' dist/manifest.json)"
          centers_sha="$(jq -r '.centers_source.sha256' dist/manifest.json)"
          osm_sha="$(jq -r '.osm_source.sha256' dist/manifest.json)"

          cat > release-notes.md <<EOF
          Snapshot de datos de distancias por carretera de Canarias.

          - Versión de datos: \`$DATA_VERSION\`
          - Centros educativos: $centers
          - Ubicaciones totales: $locations
          - SHA-256 de la fuente de centros: \`$centers_sha\`
          - SHA-256 de la fuente OSM: \`$osm_sha\`
          - Commit generador: \`$GITHUB_SHA\`
          EOF

          gh release create "$DATA_VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "$DATA_VERSION" \
            --notes-file release-notes.md \
            --latest

      - name: Stage data for Pages
        env:
          GH_TOKEN: ${{ github.token }}
          REBUILD_DATA: ${{ steps.plan.outputs.rebuild_data }}
          DATA_CHANGED: ${{ steps.compare.outputs.changed }}
        run: |
          set -eu

          rm -rf docs/data/latest
          mkdir -p docs/data/latest

          if [ "$REBUILD_DATA" = "true" ] && [ "$DATA_CHANGED" = "true" ]; then
            cp dist/canarias-distances.dat docs/data/latest/
            cp dist/centers.min.json docs/data/latest/
            cp dist/manifest.json docs/data/latest/
            cp dist/SHA256SUMS docs/data/latest/
          else
            latest_tag="$(
              gh release list \
                --exclude-drafts \
                --exclude-pre-releases \
                --limit 100 \
                --json tagName,publishedAt \
                --jq "$(cat scripts/latest-data-release.jq)"
            )"

            if [ -z "$latest_tag" ]; then
              echo "No published data-* release is available" >&2
              exit 1
            fi

            gh release download "$latest_tag" \
              --pattern canarias-distances.dat \
              --pattern centers.min.json \
              --pattern manifest.json \
              --pattern SHA256SUMS \
              --dir docs/data/latest
          fi

          cd docs/data/latest
          grep -E '  (canarias-distances\.dat|centers\.min\.json|manifest\.json)$' SHA256SUMS |
            sha256sum -c -

      - name: Generate published data documentation
        run: |
          python3 scripts/generate-docs-from-manifest.py \
            --manifest docs/data/latest/manifest.json \
            --islands config/islands.json \
            --output docs/generated

      - name: Build documentation
        run: uvx zensical build --clean

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
