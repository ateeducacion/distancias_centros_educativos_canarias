name: Documentation
on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main]
    paths: ['docs/**', 'zensical.toml', '.github/workflows/docs.yml']
permissions: {contents: read}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # v7
      - uses: astral-sh/setup-uv@v7 # v7
      - name: Download latest released data bundle
        env:
          GH_TOKEN: "${{ github.token }}"
          RELEASE_TAG: "${{ github.event.release.tag_name }}"
        run: |
          rm -rf docs/data/latest
          mkdir -p docs/data/latest
          tag="${RELEASE_TAG:-$(gh release view --json tagName --jq .tagName)}"
          gh release download "$tag" --dir docs/data/latest
          cd docs/data/latest
          sha256sum -c SHA256SUMS
      - run: uvx zensical build --clean
      - uses: actions/upload-pages-artifact@v5 # v5
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5 # v5
