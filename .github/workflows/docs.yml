name: Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions: {contents: read}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7 # v7
        with:
          ref: main
      - uses: astral-sh/setup-uv@v7 # v7
      - name: Install data build dependencies
        run: sudo apt-get update && sudo apt-get install -y zstd
      - name: Build current main data bundle
        run: DATA_VERSION="main-$(git rev-parse --short=12 HEAD)" sh scripts/build-data-ci.sh
      - name: Stage current main data for Pages
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          cd ..
          rm -rf docs/data/latest
          mkdir -p docs/data/latest
          cp dist/canarias-distances.dat docs/data/latest/
          cp dist/centers.min.json docs/data/latest/
          cp dist/manifest.json docs/data/latest/
      - run: uvx zensical build --clean
      - uses: actions/upload-pages-artifact@v5 # v5
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5 # v5
