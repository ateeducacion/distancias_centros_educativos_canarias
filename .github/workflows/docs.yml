name: Documentation
on: {workflow_dispatch: {}, push: {branches: [main], paths: ['docs/**', 'zensical.toml']}}
permissions: {contents: read}
concurrency: {group: pages, cancel-in-progress: true}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # v7
      - uses: astral-sh/setup-uv@v7 # v7
      - name: Verify Pages data bundle
        run: sha256sum -c SHA256SUMS
        working-directory: docs/data/latest
      - run: uvx zensical build --clean
      - uses: actions/upload-pages-artifact@v5 # v5
        with: {path: site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {pages: write, id-token: write}
    environment: {name: github-pages, url: "${{ steps.deployment.outputs.page_url }}"}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5 # v5
