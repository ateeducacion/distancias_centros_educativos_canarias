name: CI
on: [push, pull_request]
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4 # v4; pin to commit SHA before production enablement
      - uses: astral-sh/setup-uv@v5 # v5
      - run: uv sync --all-extras
      - run: make test-python
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: actions/setup-node@v4 # v4
        with: {node-version: 20, cache: npm, cache-dependency-path: packages/javascript/package-lock.json}
      - run: npm install
        working-directory: packages/javascript
      - run: npm test
        working-directory: packages/javascript
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy: {matrix: {php: ['8.2', '8.3', '8.4']}}
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: shivammathur/setup-php@v2 # v2
        with: {php-version: "${{ matrix.php }}", tools: composer}
      - run: composer install
        working-directory: packages/php
      - run: composer test
        working-directory: packages/php
  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # v4
      - run: python3 -m json.tool data/samples/sample-manifest.json >/dev/null
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4 # v4
      - run: composer install
        working-directory: packages/php
      - run: tests/conformance/run.sh
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4 # v4
      - uses: astral-sh/setup-uv@v5 # v5
      - run: uvx zensical build --clean
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4 # v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck scripts/*.sh bin/route-matrix
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4 # v4
      - run: docker compose build
