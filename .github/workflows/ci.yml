name: CI
on: [push, pull_request]
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # v4; pin to commit SHA before production enablement
      - uses: astral-sh/setup-uv@v7 # v5
      - run: uv sync --all-extras
      - run: make test-python
  javascript:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: actions/setup-node@v7 # v4
        with: {node-version: 20, cache: npm, cache-dependency-path: packages/javascript/package-lock.json}
      - run: npm install
        working-directory: packages/javascript
      - run: npm test
        working-directory: packages/javascript
  php:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy: {matrix: {php: ['8.2', '8.3', '8.4']}}
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: shivammathur/setup-php@v2 # v2
        with: {php-version: "${{ matrix.php }}", tools: composer}
      - run: composer install
        working-directory: packages/php
      - run: composer test
        working-directory: packages/php
  schemas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # v4
      - run: python3 -m json.tool data/samples/sample-manifest.json >/dev/null
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # v4
      - run: composer install
        working-directory: packages/php
      - run: tests/conformance/run.sh
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7 # v4
      - uses: astral-sh/setup-uv@v7 # v5
      - run: uvx zensical build --clean
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7 # v4
      - run: sudo apt-get update && sudo apt-get install -y jq shellcheck
      - run: shellcheck scripts/*.sh bin/route-matrix
      - name: Test latest data release selector
        run: |
          latest_tag="$(
            cat <<'JSON' | jq -r -f scripts/latest-data-release.jq
          [
            {
              "tagName": "v0.0.3",
              "publishedAt": "2026-07-14T18:00:00Z"
            },
            {
              "tagName": "data-20260714-2030",
              "publishedAt": "2026-07-14T20:30:00Z"
            },
            {
              "tagName": "data-20260714-2045",
              "publishedAt": "2026-07-14T20:45:00Z"
            }
          ]
          JSON
          )"
          test "$latest_tag" = "data-20260714-2045"
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7 # v4
      - run: docker compose build
